<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5f7">
  <title>A little question for you</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #402b3b;
      background: #fff5f7;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      background:
        radial-gradient(ellipse at 15% 18%, #ffe1e9 0, transparent 35%),
        radial-gradient(ellipse at 85% 82%, #ffe9d9 0, transparent 34%),
        #fff5f7;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 480px);
      padding: clamp(28px, 7vw, 48px);
      border: 1px solid #ffffff;
      border-radius: 28px;
      background: rgb(255 255 255 / 88%);
      box-shadow: 0 22px 70px rgb(122 61 85 / 12%);
      text-align: center;
    }

    .heart { font-size: 42px; }

    h1 {
      margin: 14px 0 12px;
      color: #a83f68;
      font-size: clamp(1.8rem, 7vw, 2.5rem);
      line-height: 1.12;
    }

    p {
      margin: 0;
      color: #765d6b;
      font-size: 1.08rem;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      min-height: 62px;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-top: 28px;
    }

    button, select, input {
      font: inherit;
    }

    button {
      min-height: 48px;
      padding: 12px 25px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    button:hover { transform: translateY(-2px); }

    .yes, .submit {
      color: white;
      background: linear-gradient(135deg, #e85585, #c63d72);
      box-shadow: 0 8px 20px rgb(198 61 114 / 23%);
    }

    .yes:hover, .submit:hover {
      box-shadow: 0 11px 24px rgb(198 61 114 / 30%);
    }

    .no {
      color: #765d6b;
      background: #f4edf0;
    }

    .no.is-running {
      position: fixed;
      z-index: 3;
      transition: left 170ms ease, top 170ms ease;
    }

    .details {
      display: grid;
      gap: 18px;
      margin-top: 26px;
      text-align: left;
    }

    .details[hidden], .success[hidden] { display: none; }

    label {
      display: grid;
      gap: 8px;
      color: #654557;
      font-size: .95rem;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      min-height: 48px;
      padding: 10px 13px;
      border: 1px solid #ead8e0;
      border-radius: 12px;
      outline: none;
      color: #402b3b;
      background: white;
    }

    input:focus, select:focus {
      border-color: #d95d88;
      box-shadow: 0 0 0 3px rgb(217 93 136 / 15%);
    }

    .submit { width: 100%; margin-top: 4px; }

    .success h1 { margin-top: 0; }
    .success p + p { margin-top: 10px; }

    #fireworks {
      position: fixed;
      z-index: 2;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <main class="card">
    <section id="question">
      <div class="heart" aria-hidden="true">💌</div>
      <h1>Hi, I’m Mark Jroa!</h1>
      <p>Would you like to go on a date with me?</p>
      <div class="buttons">
        <button class="yes" id="yesButton" type="button">Yes! 💖</button>
        <button class="no" id="noButton" type="button" aria-label="No (this button is very shy)">No 🙈</button>
      </div>
    </section>

    <form class="details" id="dateForm" hidden>
      <div>
        <div class="heart" aria-hidden="true">🥰</div>
        <h1>Yay! It’s a date!</h1>
        <p>When should we go, and what fast food sounds good?</p>
      </div>
      <label for="date">Pick a date
        <input id="date" name="date" type="date" required>
      </label>
      <label for="restaurant">Choose a fast-food place
        <select id="restaurant" name="restaurant" required>
          <option value="" disabled selected>Pick your favorite</option>
          <option>Jollibee</option>
          <option>McDonald’s</option>
          <option>KFC</option>
          <option>Burger King</option>
          <option>Subway</option>
          <option>You choose!</option>
        </select>
      </label>
      <button class="submit" type="submit">Confirm our date ✨</button>
    </form>

    <section class="success" id="success" hidden aria-live="polite">
      <div class="heart" aria-hidden="true">🎆</div>
      <h1>It’s a date!</h1>
      <p id="dateSummary"></p>
      <p>Can’t wait! 💖</p>
    </section>
  </main>

  <script>
    const question = document.querySelector("#question");
    const dateForm = document.querySelector("#dateForm");
    const success = document.querySelector("#success");
    const noButton = document.querySelector("#noButton");
    const canvas = document.querySelector("#fireworks");
    const context = canvas.getContext("2d");
    const dateInput = document.querySelector("#date");
    const today = new Date();
    const localToday = new Date(today.getTime() - today.getTimezoneOffset() * 60000)
      .toISOString().slice(0, 10);
    dateInput.min = localToday;

    document.querySelector("#yesButton").addEventListener("click", () => {
      question.hidden = true;
      dateForm.hidden = false;
      dateInput.focus();
    });

    function moveNoButton() {
      const padding = 12;
      const maxX = Math.max(padding, window.innerWidth - noButton.offsetWidth - padding);
      const maxY = Math.max(padding, window.innerHeight - noButton.offsetHeight - padding);
      let x = padding + Math.random() * (maxX - padding);
      let y = padding + Math.random() * (maxY - padding);
      const card = document.querySelector(".card").getBoundingClientRect();

      for (let attempt = 0; attempt < 12; attempt += 1) {
        if (x + noButton.offsetWidth < card.left || x > card.right ||
            y + noButton.offsetHeight < card.top || y > card.bottom) break;
        x = padding + Math.random() * (maxX - padding);
        y = padding + Math.random() * (maxY - padding);
      }

      noButton.classList.add("is-running");
      noButton.style.left = `${x}px`;
      noButton.style.top = `${y}px`;
    }

    noButton.addEventListener("click", (event) => {
      event.preventDefault();
      moveNoButton();
    });

    dateForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!dateForm.reportValidity()) return;

      const date = new Date(`${dateInput.value}T00:00:00`);
      const formattedDate = new Intl.DateTimeFormat(undefined, {
        dateStyle: "long"
      }).format(date);
      document.querySelector("#dateSummary").textContent =
        `See you on ${formattedDate} at ${document.querySelector("#restaurant").value}!`;
      dateForm.hidden = true;
      success.hidden = false;
      startFireworks();
    });

    const particles = [];
    let animationFrame;

    function resizeCanvas() {
      const pixelRatio = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * pixelRatio;
      canvas.height = window.innerHeight * pixelRatio;
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function burst() {
      const colors = ["#ff5277", "#ffc857", "#8f7cff", "#55c9a5", "#fff1a8"];
      const x = Math.random() * window.innerWidth;
      const y = 70 + Math.random() * window.innerHeight * 0.55;
      const color = colors[Math.floor(Math.random() * colors.length)];

      for (let i = 0; i < 55; i += 1) {
        const angle = (Math.PI * 2 * i) / 55;
        const speed = 1.2 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 55 + Math.random() * 30,
          color
        });
      }
    }

    function animateFireworks() {
      context.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (let i = particles.length - 1; i >= 0; i -= 1) {
        const particle = particles[i];
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vy += 0.035;
        particle.life -= 1;
        context.globalAlpha = Math.min(1, particle.life / 25);
        context.fillStyle = particle.color;
        context.beginPath();
        context.arc(particle.x, particle.y, 2.3, 0, Math.PI * 2);
        context.fill();
        if (particle.life <= 0) particles.splice(i, 1);
      }
      context.globalAlpha = 1;
      animationFrame = requestAnimationFrame(animateFireworks);
    }

    function startFireworks() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      burst();
      burst();
      animateFireworks();
      const interval = window.setInterval(burst, 650);
      window.setTimeout(() => {
        window.clearInterval(interval);
        window.cancelAnimationFrame(animationFrame);
      }, 8000);
    }
  </script>
</body>
</html>
